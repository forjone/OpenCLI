[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crosspost"
version = "0.1.0"
description = "Private video cross-posting tool for Douyin / Bilibili / Xiaohongshu / WeChat Channels with AI platform adapters"
requires-python = ">=3.12"
dependencies = [
  "patchright==1.58.2",
  "loguru==0.7.3",
  "qrcode==8.2",
  "segno>=1.6.6",
  "requests==2.32.3",
  "opencv-python>=4.13.0.92",
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
crosspost = "cli:main"

[tool.setuptools]
py-modules = ["conf", "cli", "web"]

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "core*", "adapters*", "storage*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
adapters = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
